<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f8fd"/><stop offset="1" stop-color="#e3eaf5"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111c2f"/><stop offset="1" stop-color="#2d3c58"/></linearGradient>
 <style>
 .labelTitle{font:700 17px Arial,sans-serif;fill:#173a65}.labelSub{font:14px Arial,sans-serif;fill:#4d5d74}
 .num{font:700 16px Arial,sans-serif;fill:#fff;text-anchor:middle}
 .line{fill:none;stroke:#16a4e8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
 </style>
</defs>
