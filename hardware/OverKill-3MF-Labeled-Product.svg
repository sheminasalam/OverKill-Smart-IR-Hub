<path class="line" d="M1230 665 L1187 665 L1187 640 L800 640"/>
<path class="line" d="M1230 815 L1184 815 L1184 780 L742 735"/>
<!-- anchor dots -->
<g fill="#087db8" stroke="#fff" stroke-width="3">
 <circle cx="800" cy="305" r="8"/><circle cx="790" cy="325" r="8"/><circle cx="756" cy="485" r="8"/><circle cx="878" cy="395" r="8"/><circle cx="742" cy="590" r="8"/><circle cx="800" cy="640" r="8"/><circle cx="742" cy="735" r="8"/>
</g>
<!-- label cards -->
<g>
 <rect x="35" y="170" width="335" height="100" rx="15" fill="#fff" stroke="#bfd0e4" stroke-width="2"/>
 <circle cx="64" cy="199" r="19" fill="#174a7a"/><text class="num" x="64" y="205">01</text>
 <text class="labelTitle" x="91" y="199">Top-plate openings</text><text class="labelSub" x="91" y="226">Temperature probe (DS18B20)</text><text class="labelSub" x="91" y="247">IR receiver for learning + status LED</text>
 <rect x="1230" y="225" width="335" height="100" rx="15" fill="#fff" stroke="#bfd0e4" stroke-width="2"/>
 <circle cx="1259" cy="254" r="19" fill="#174a7a"/><text class="num" x="1259" y="260">02</text>
 <text class="labelTitle" x="1286" y="254">USB-C 5 V power inlet</text><text class="labelSub" x="1286" y="281">4-pin breakout PCB provision</text><text class="labelSub" x="1286" y="302">VBUS/GND supply input</text>
 <rect x="1230" y="355" width="335" height="100" rx="15" fill="#fff" stroke="#bfd0e4" stroke-width="2"/>
 <circle cx="1259" cy="384" r="19" fill="#174a7a"/><text class="num" x="1259" y="390">03</text>
 <text class="labelTitle" x="1286" y="384">Main enclosure shell</text><text class="labelSub" x="1286" y="411">D1 mini is used in the author's build</text><text class="labelSub" x="1286" y="432">Bare ESP-12F needs 3.3 V regulation</text>
 <rect x="1230" y="485" width="335" height="100" rx="15" fill="#fff" stroke="#bfd0e4" stroke-width="2"/>
 <circle cx="1259" cy="514" r="19" fill="#174a7a"/><text class="num" x="1259" y="520">04</text>
 <text class="labelTitle" x="1286" y="514">USB-C breakout mount</text><text class="labelSub" x="1286" y="541">Side-wall provision for the PCB</text><text class="labelSub" x="1286" y="562">Use USB-A to USB-C unless CC wiring is added</text>
 <rect x="35" y="570" width="335" height="100" rx="15" fill="#fff" stroke="#bfd0e4" stroke-width="2"/>
 <circle cx="64" cy="599" r="19" fill="#174a7a"/><text class="num" x="64" y="605">05</text>
 <text class="labelTitle" x="91" y="599">IR learning</text><text class="labelSub" x="91" y="626">Start learning from the Web UI</text><text class="labelSub" x="91" y="647">Receiver captures the original remote</text>
 <rect x="1230" y="615" width="335" height="100" rx="15" fill="#fff" stroke="#bfd0e4" stroke-width="2"/>
 <circle cx="1259" cy="644" r="19" fill="#174a7a"/><text class="num" x="1259" y="650">06</text>
 <text class="labelTitle" x="1286" y="644">Lower collar / band</text><text class="labelSub" x="1286" y="671">Enclosure trim feature</text><text class="labelSub" x="1286" y="692">Part of the printed shell</text>
 <rect x="1230" y="765" width="335" height="100" rx="15" fill="#fff" stroke="#bfd0e4" stroke-width="2"/>
 <circle cx="1259" cy="794" r="19" fill="#174a7a"/><text class="num" x="1259" y="800">07</text>
 <text class="labelTitle" x="1286" y="794">Reset button access</text><text class="labelSub" x="1286" y="821">Physical reset button is underneath</text><text class="labelSub" x="1286" y="842">Connect to D1 mini RST</text>
</g>
<rect x="35" y="952" width="1530" height="63" rx="14" fill="#fff" stroke="#bfd0e4" stroke-width="2"/>
<text x="60" y="978" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#173a65">IMPORTANT</text>
<text x="170" y="978" font-family="Arial,sans-serif" font-size="15" fill="#354b65">MODEL VIEW: enclosure geometry only; electronics are not installed in this render. Top: DS18B20, IR receiver for learning, status LED. Side: USB-C 5 V breakout provision. Underside: reset button. There is no physical learn button.</text>
<text x="60" y="1000" font-family="Arial,sans-serif" font-size="14" fill="#4d5d74">Print in PETG. The D1 mini has onboard 3.3 V regulation; a bare ESP-12F requires an external 5 V-to-3.3 V regulator.</text>
</svg>