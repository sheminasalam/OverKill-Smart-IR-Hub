<text x="68" y="63" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="700">OVERKILL SMART IR HUB</text>
<text x="70" y="94" fill="#dbe9ff" font-family="Arial,sans-serif" font-size="18">Labeled enclosure openings and controls from the uploaded Overkill.3mf</text>
<rect x="1498" y="46" width="36" height="36" rx="18" fill="#2c77b8"/><text x="1516" y="69" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3D</text>
<rect x="408" y="130" width="784" height="795" rx="24" fill="url(#panel)" stroke="#7186a6" stroke-width="2"/>
<image x="450" y="172" width="700" height="700" preserveAspectRatio="xMidYMid meet" href="data:image/jpeg;base64,"/>
