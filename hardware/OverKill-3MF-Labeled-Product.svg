<rect x="35" y="952" width="1530" height="63" rx="14" fill="#fff" stroke="#bfd0e4" stroke-width="2"/>
<text x="60" y="978" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#173a65">IMPORTANT</text>
<text x="170" y="978" font-family="Arial,sans-serif" font-size="15" fill="#354b65">This 3MF contains enclosure geometry only. ESP8266, flash module, IR receiver, IR LEDs, wiring and PCB are not included in the model render.</text>
<text x="60" y="1000" font-family="Arial,sans-serif" font-size="14" fill="#4d5d74">Print the enclosure in PETG. Confirm dimensions, hardware fit and the optical openings on a test print before final assembly.</text>
