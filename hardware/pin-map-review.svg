<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<rect width="1600" height="1080" fill="#f5f8fc"/>
<rect x="30" y="24" width="1540" height="100" rx="18" fill="#103b69"/>
<text x="64" y="67" fill="#fff" font-size="36" font-weight="700" font-family="Arial,sans-serif">OverKill Smart IR Hub — Firmware Pin Map Review</text>
<text x="66" y="101" fill="#dbeaff" font-size="19" font-family="Arial,sans-serif">Source review aid, not a wiring-verified schematic</text>
<rect x="36" y="148" width="1528" height="128" rx="16" fill="#fff2d3" stroke="#d69b21" stroke-width="3"/>
<text x="62" y="188" fill="#9b281a" font-size="28" font-weight="700" font-family="Arial,sans-serif">RELEASE BLOCKER — EXTERNAL FLASH CHIP SELECT DISAGREEMENT</text>
<text x="62" y="224" fill="#263746" font-size="22" font-family="Arial,sans-serif">OverKill-v1.ino sets PIN_FLASH_CS = GPIO3 (UART0 RX). Firmware Stage Info and supplied drawing say GPIO15.</text>
<text x="62" y="255" fill="#263746" font-size="22" font-weight="700" font-family="Arial,sans-serif">Verify physical wiring and correct firmware + schematic together before building or publishing as final.</text>
<rect x="42" y="310" width="735" height="500" rx="18" fill="#fff" stroke="#9aafc2" stroke-width="2"/>
<text x="72" y="355" fill="#103b69" font-size="27" font-weight="700" font-family="Arial,sans-serif">Pin assignments from firmware constants</text>
<text x="72" y="397" fill="#4b6074" font-size="17" font-family="Arial,sans-serif">Signal</text><text x="340" y="397" fill="#4b6074" font-size="17" font-family="Arial,sans-serif">Default GPIO</text><text x="485" y="397" fill="#4b6074" font-size="17" font-family="Arial,sans-serif">Status</text>
<g font-family="Arial,sans-serif" font-size="19" fill="#172b3e">
<rect x="62" y="412" width="695" height="43" rx="7" fill="#fbe4df"/><text x="78" y="439">External flash CS</text><text x="352" y="439" font-weight="700" fill="#b12020">GPIO3</text><text x="485" y="439" fill="#b12020">UART0 RX conflict</text>
<rect x="62" y="461" width="695" height="43" rx="7" fill="#edf3fa"/><text x="78" y="488">External flash bus</text><text x="352" y="488" font-weight="700">12 / 13 / 14</text><text x="485" y="488">MISO / MOSI / SCLK</text>
<rect x="62" y="510" width="695" height="43" rx="7" fill="#edf3fa"/><text x="78" y="537">IR transmitter</text><text x="352" y="537" font-weight="700">GPIO4</text><text x="485" y="537">Default, configurable</text>
<rect x="62" y="559" width="695" height="43" rx="7" fill="#edf3fa"/><text x="78" y="586">IR receiver</text><text x="352" y="586" font-weight="700">GPIO5</text><text x="485" y="586">Default, configurable</text>
<rect x="62" y="608" width="695" height="43" rx="7" fill="#edf3fa"/><text x="78" y="635">Status LED</text><text x="352" y="635" font-weight="700">GPIO2</text><text x="485" y="635">Single LED, active LOW</text>
<rect x="62" y="657" width="695" height="43" rx="7" fill="#edf3fa"/><text x="78" y="684">DS18B20 data</text><text x="352" y="684" font-weight="700">GPIO16</text><text x="485" y="684">Default, optional sensor</text>
<rect x="62" y="706" width="695" height="43" rx="7" fill="#edf3fa"/><text x="78" y="733">Physical learn button</text><text x="352" y="733" font-weight="700">GPIO0</text><text x="485" y="733">Disabled / boot strap</text>
<text x="72" y="784" fill="#4b6074" font-size="16">UART0 TX/RX are GPIO1/GPIO3. Pin changes may be persisted for IR TX/RX, LED and DS18B20.</text>
</g>
<rect x="807" y="310" width="751" height="500" rx="18" fill="#fff" stroke="#9aafc2" stroke-width="2"/>
<text x="837" y="355" fill="#103b69" font-size="27" font-weight="700" font-family="Arial,sans-serif">Parts shown in supplied diagram that need review</text>
<g font-family="Arial,sans-serif" font-size="21" fill="#172b3e">
<circle cx="850" cy="406" r="7" fill="#c42d26"/><text x="873" y="413" font-weight="700">W25Qxx CS</text><text x="873" y="444" font-size="18">Drawing says GPIO15; actual CS constant is GPIO3.</text>
<circle cx="850" cy="485" r="7" fill="#c42d26"/><text x="873" y="492" font-weight="700">RGB LED</text><text x="873" y="523" font-size="18">Drawing uses GPIO1/2/3; firmware defines one active-LOW</text><text x="873" y="547" font-size="18">status LED default on GPIO2, no RGB pin map.</text>
<circle cx="850" cy="584" r="7" fill="#c42d26"/><text x="873" y="591" font-weight="700">Learn / reset buttons</text><text x="873" y="622" font-size="18">Source says physical learn button was removed/disabled;</text><text x="873" y="646" font-size="18">no separate reset-button GPIO is defined.</text>
<circle cx="850" cy="683" r="7" fill="#c47a14"/><text x="873" y="690" font-weight="700">12-LED array</text><text x="873" y="721" font-size="18">Six 2-LED series branches with 30-ohm resistors are drawn,</text><text x="873" y="745" font-size="18">but current/thermal ratings must be calculated and tested.</text>
<text x="837" y="784" fill="#b12020" font-size="17" font-weight="700">This review graphic intentionally does not prescribe a wiring fix.</text>
</g>
<rect x="42" y="834" width="1516" height="204" rx="18" fill="#fff" stroke="#9aafc2" stroke-width="2"/>
<text x="72" y="878" fill="#103b69" font-size="27" font-weight="700" font-family="Arial,sans-serif">Before publishing a final schematic</text>
<g fill="#263746" font-family="Arial,sans-serif" font-size="20">
<text x="76" y="923">1. Confirm which GPIO actually reaches the flash CS pad on the physical board.</text>
<text x="76" y="960">2. Correct the code and drawing as a pair; test boot, serial access and flash read/write/erase.</text>
<text x="76" y="997">3. Decide whether the hardware uses one status LED or RGB, and document the real reset/learn controls.</text>
<text x="880" y="923">4. Calculate branch current from the exact IR LED Vf, supply tolerance and resistor wattage.</text>
<text x="880" y="960">5. Verify MOSFET pulsed current, power supply, common ground and heat before all branches are populated.</text>
</g>
</svg>